<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISL Avatar</title>
  <style>
    /* Minimal styling per spec: black canvas background */
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    #wrap {
      display: grid;
      place-items: center;
      height: 100%;
    }

    canvas {
      background: black;
      width: 800px;
      height: 600px;
      /* The renderer will internally scale for HiDPI */
    }

    #hint {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div>
      <canvas id="canvas" width="800" height="600"></canvas>
      <div id="hint">If you see nothing: run <code>python extract.py</code> then <code>python -m http.server 8000</code>.</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
