name: Deploy static content to Pages

on:
  push:
    branches: ["smplx-interpolations-handover", "gh-pages", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web files only
        run: |
          mkdir -p _site
          cp index.html website.html dataset.html .nojekyll script.js _site/ 2>/dev/null || true
          cp -r api _site/ 2>/dev/null || true
          cp -r data _site/ 2>/dev/null || true
          cp -r src _site/ 2>/dev/null || true
          mkdir -p _site/skinning
          cp skinning/website.html skinning/dataset.html _site/skinning/ 2>/dev/null || true
          cp -r skinning/api _site/skinning/ 2>/dev/null || true
          cp -r skinning/data _site/skinning/ 2>/dev/null || true
          cp -r skinning/src _site/skinning/ 2>/dev/null || true
          cp -r skinning/ISLRTC-WEBSITE _site/skinning/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
